        🔐 登录（`VISITOR` 一律 403，禁止查阅/提交作业）。

        - 状态由时间派生（服务端判定，前端倒计时仅展示）：`NOT_STARTED`（now < startAt）/ `OPEN`（startAt ≤ now ≤ deadlineAt）/ `CLOSED`（now > deadlineAt）。
        - `canSubmit` 仅 `MEMBER`/`ALUMNI` 且 state === 'OPEN' 时为 true。
        - `mySubmission` 为当前用户在该作业下的提交（无则 null）。
        - `keyword` 可选，≤100：标题/描述模糊匹配，或命中发布者用户名/昵称（该发布者作业一并命中）。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/KeywordParam'
      responses:
        '200':
          description: 作业分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'VISITOR 禁止查阅/提交作业'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 无权访问该资源
                path: /api/v1/assignments
                timestamp: '2026-11-09T03:04:10.212Z'
    post:
      tags: [作业]
      summary: 发布作业
      operationId: assignmentsCreate
      description: |
        🛡️ 角色：仅 `ADMIN`、`ALUMNI`、`WHEEL`。

        - `startAt`、`deadlineAt` 必须是带 `Z` 的 ISO 8601 UTC 字符串（秒必填，毫秒可选、最多 3 位）；数字时间戳、无时区时间及无效日历日期返回 400。
        - 成功同时向 `MEMBER`/`ALUMNI` 全体发站内通知（type = ASSIGNMENT）。
        - 创建时由标题生成唯一 slug。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
            example:
              title: 第一次作业
              description: 完成实验一并提交报告
              startAt: '2026-11-01T00:00:00.000Z'
              deadlineAt: '2026-11-30T23:59:59.000Z'
