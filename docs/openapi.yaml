  /auth/password/reset:
    post:
      tags: [认证]
      summary: 重置密码
      operationId: authResetPassword
      description: |
        🔓 公开。凭忘记密码邮件（/auth/password/forgot）中的一次性 token 设置新密码（v12.0）。

        - token 一次性消费、30 分钟有效；新密码同注册复杂度规则（8~128 位、至少两类字符）。
        - 成功后**全会话失效**（清空全部 refresh 并递增 sessionVersion，同 /auth/password 口径）。
        - 失败：400「链接无效或已过期」（token 无效/过期/已消费，或账号已封禁）/ 新密码复杂度不足 / 两次输入的密码不一致。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: 4f8c2b6a1d3e5f7a9b0c2d4e6f8a0b1c
              newPassword: Str0ngPass!23
              newPasswordConfirm: Str0ngPass!23
      responses:
        '204':
          description: 重置成功，无响应体；全部 refresh 作废并递增 sessionVersion
        '400':
          description: '链接无效或已过期 / 新密码复杂度不足「密码需包含大写字母、小写字母、数字、符号中的至少两类」/ 两次输入的密码不一致'
          content:
