  /storage/files/{key}:
    get:
      tags: [存储]
      summary: 读取文件
      operationId: storageGetFile
      description: |
        🔐 登录。读取受控存储中的文件。

        - `key` = 存储 key（UUID + 扩展名，如 `0f8fad5b-d9cb-469f-a165-70867728950e.pdf`）；非法 key 格式返回 404。
        - 对象存储 bucket 不开放公共访问，所有文件 URL 一律经本受控接口（`AttachmentView.url` 即指向这里）。
        - 成功返回文件二进制（`Content-Type` 按扩展名推断，`Content-Disposition: inline`）。
        - 作业附件下载请走 4.4（`Content-Disposition: attachment`）。
      parameters:
        - name: key
          in: path
          required: true
          description: 存储 key（UUID + 扩展名）
          schema:
            type: string
      responses:
        '200':
          description: '文件二进制（Content-Disposition: inline）'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '文件不存在或 key 格式非法'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
