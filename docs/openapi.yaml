  /articles:
    get:
      tags: [文章]
      summary: 文章列表
      operationId: articlesList
      description: |
        🔐 登录。分页返回文章列表。

        - 状态枚举：`PENDING`（待审）/ `PUBLISHED`（已发布）/ `REJECTED`（已拒绝）/ `HIDDEN`（已隐藏）。
        - 可见性：默认仅返回 `PUBLISHED`；按 `authorId` 过滤时，只有作者本人或 `WHEEL` / `ADMIN` 可查看该作者的全部状态。
        - `authorId` 支持 uuid / 用户名 / 邮箱 / 手机号（解析不到返回空列表，不报错）。
        - `keyword` ≤100：标题/正文模糊匹配，或命中作者用户名/昵称（该作者文章一并命中）。
        - 返回 `readingMinutes`（阅读时长，正整数分钟）：按当前完整正文估算，中文 300 字/分钟、其他文字 200 词/分钟，混合累计向上取整，至少 1 分钟；链接、图片与 HTML 标签不计入，只读不存库。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/KeywordParam'
        - $ref: '#/components/parameters/AuthorIdParam'
        - $ref: '#/components/parameters/TagFilterParam'
      responses:
        '200':
          description: 文章分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
              example:
                items:
                  - id: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
                    slug: hello-ustil
                    title: USTIL 学习路线
                    excerpt: 从零开始的 USTIL 学习路线……
                    tags: [USTIL, 入门]
                    status: PUBLISHED
                    readingMinutes: 4
                    author:
                      id: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1f
                      username: xiaoming
                      nickname: 小明
                      avatarUrl: null
                      role: MEMBER
                    createdAt: '2026-11-09T03:04:10.212Z'
                    updatedAt: '2026-11-09T03:04:10.212Z'
                total: 1
                page: 1
                pageSize: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [文章]
      summary: 创建文章
      operationId: articlesCreate
      description: |
        🛡️ 角色：`MEMBER`、`ALUMNI`、`WHEEL`、`ADMIN`（VISITOR 403）。

        - `MEMBER` 发文**先审后发**：创建即 `PENDING`，3.7 审核通过后可见；`ALUMNI`/`WHEEL`/`ADMIN` **先发后审**：创建即 `PUBLISHED`（可被隐藏）。
        - `tags` 可选：数组 ≤10 项，每项 ≤30 字符；显式 `null` 返回 400。
        - 创建时由标题生成唯一 slug。标题去空白后 ≤200 字符、纯空白 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
            example:
              title: USTIL 学习路线
              content: '# 前言\n\n正文……'
              tags: [USTIL, 入门]
      responses:
        '201':
          description: 创建成功，返回文章详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '角色不足（VISITOR 不可发文）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 无权访问该资源
                path: /api/v1/articles
                timestamp: '2026-11-09T03:04:10.212Z'
