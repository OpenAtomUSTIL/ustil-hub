      tags: [后台管理]
      summary: 修改用户角色
      operationId: adminUpdateRole
      description: |
        🛡️ 角色：**仅 `ADMIN`**（`WHEEL` 403）。

        - 寻址：`id` 支持 uuid / username / email / phone（uuid 优先），解析不到 404「用户不存在」。
        - `role` 仅可授予/变更为 `VISITOR | MEMBER | ALUMNI | WHEEL`（**不能授予/变更为 `ADMIN`**，ADMIN 仅由种子脚本创建）。
        - 目标是 `ADMIN` 账号时 403（不可修改）。操作同时递增目标 `sessionVersion` 强制重新登录。
      parameters:
        - $ref: '#/components/parameters/AdminUserRefParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRoleRequest'
            example:
              role: WHEEL
      responses:
        '200':
          description: 修改后的用户条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '400':
          description: 'role 为 ADMIN 或非法枚举 / 校验失败'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                error: Bad Request
                message: role 不能为 ADMIN
                path: /api/v1/admin/users/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e/role
                timestamp: '2026-11-09T03:04:10.212Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '非 ADMIN；或目标是 ADMIN 账号（不可被改角色）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 无权访问该资源
                path: /api/v1/admin/users/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e/role
                timestamp: '2026-11-09T03:04:10.212Z'
        '404':
          description: '用户不存在（解析式寻址未命中）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                error: Not Found
                message: 用户不存在
                path: /api/v1/admin/users/nobody/role
                timestamp: '2026-11-09T03:04:10.212Z'
