        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/trash/{type}/{id}/restore:
    post:
      tags: [后台管理]
      summary: 还原回收站条目
      operationId: adminRestoreTrash
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。还原软删条目，写入审计 `article.restore` / `announcement.restore` / `resource.restore` / `issue.restore` / `assignment.restore` / `comment.restore`。

        - `type` = `ARTICLE | ANNOUNCEMENT | RESOURCE | ISSUE | ASSIGNMENT | COMMENT`（大小写不敏感）。
        - 还原后完整可见（taggings 保留）。**重复恢复返回 409，非幂等 204**。
        - 失败：404 条目不存在；409 内容未被删除，无需恢复。
      parameters:
        - name: type
          in: path
          required: true
          description: 软删类型（大小写不敏感）
          schema:
            $ref: '#/components/schemas/TrashType'
        - name: id
          in: path
          required: true
          description: 条目 uuid
          schema:
            type: string
      responses:
        '204':
          description: 已还原，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '条目不存在'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                error: Not Found
                message: 条目不存在
                path: /api/v1/admin/trash/ARTICLE/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e/restore
                timestamp: '2026-11-09T03:04:10.212Z'
        '409':
          description: '内容未被删除，无需恢复（重复恢复返回 409，非幂等 204）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                error: Conflict
                message: 内容未被删除，无需恢复
                path: /api/v1/admin/trash/ARTICLE/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e/restore
                timestamp: '2026-11-09T03:04:10.212Z'
