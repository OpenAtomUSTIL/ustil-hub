          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                error: Bad Request
                message: startAt 必须是带 Z 的 ISO 8601 UTC 字符串
                path: /api/v1/assignments
                timestamp: '2026-11-09T03:04:10.212Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
