        - 非 `PUBLISHED` 文章仅**作者**与 `WHEEL`/`ADMIN` 可见（他人访问 404）。
        - 软删文章详情 404。拒绝/隐藏备注经 `reviewNote` 对作者可见（审核记录另有 reviewedBy / reviewedAt 服务端留档）。
        - 返回 `readingMinutes`（见 3.1 说明）。
