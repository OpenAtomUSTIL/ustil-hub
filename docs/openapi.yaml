    RegisterRequest:
      type: object
      description: 注册请求（密码 8~128 位且四类字符至少两类；identifier 仅邮箱，须先经 /auth/email-code 拉取邮件验证码）
      required: [identifier, emailCode, password, passwordConfirm, nickname, captchaId, captchaCode]
      properties:
        identifier:
          type: string
          format: email
          description: 仅邮箱（v12.0 起手机号改为可选附加绑定，注册仅邮箱）
        emailCode:
          type: string
          maxLength: 16
          description: 邮件验证码（发往 identifier 邮箱，purpose=register，见 POST /auth/email-code），一次性消费
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 大写/小写/数字/符号四类中至少两类
        passwordConfirm:
          type: string
          format: password
          description: 确认密码，必填，须与 password 一致
        nickname:
          type: string
          maxLength: 50
        inviteCode:
          type: string
          description: 可选；有效则注册为 MEMBER 并核销名额
        captchaId:
          type: string
          description: 图形验证码 id（见 GET /auth/captcha）
        captchaCode:
          type: string
          description: 图形验证码答案
    InviteCodeRequest:
      type: object
      description: 持码转正请求（仅 VISITOR）
      required: [inviteCode, captchaId, captchaCode]
      properties:
        inviteCode:
          type: string
        captchaId:
          type: string
        captchaCode:
          type: string
    LoginRequest:
      type: object
      description: 登录请求
      required: [identifier, password, captchaId, captchaCode]
      properties:
        identifier:
          type: string
          description: 邮箱或手机号
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        captchaId:
          type: string
        captchaCode:
          type: string
    ChangePasswordRequest:
      type: object
      description: 修改密码请求（newPassword 同注册复杂度规则；emailCode 为当前绑定邮箱的邮件验证码，purpose=password）
      required: [currentPassword, newPassword, emailCode, captchaId, captchaCode]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        emailCode:
          type: string
          description: 邮件验证码（purpose=password，发往当前绑定邮箱）
          maxLength: 16
        captchaId:
          type: string
        captchaCode:
          type: string
    SendEmailCodeRequest:
      type: object
      description: 拉取邮件验证码请求（注册 / 换绑邮箱统一入口，图形验证码前置防轰炸）
      required: [email, purpose, captchaId, captchaCode]
      properties:
        email:
          type: string
          format: email
          description: 接收验证码的邮箱（purpose=register 为待注册邮箱，purpose=rebind 为新邮箱）
        purpose:
          type: string
          enum: [register, rebind]
          description: register 配合 /auth/register；rebind 配合 /users/me/identifier 换绑
        captchaId:
          type: string
          description: 图形验证码 id（见 GET /auth/captcha）
        captchaCode:
          type: string
          description: 图形验证码答案
    ForgotPasswordRequest:
      type: object
      description: 忘记密码请求（无论账号是否存在均 204，防账号枚举）
      required: [identifier, captchaId, captchaCode]
      properties:
        identifier:
          type: string
          format: email
          description: 绑定的邮箱
        captchaId:
          type: string
        captchaCode:
          type: string
    ResetPasswordRequest:
      type: object
      description: 重置密码请求（凭忘记密码邮件的一次性 token 设置新密码，成功后全会话失效）
      required: [token, newPassword, newPasswordConfirm]
      properties:
        token:
          type: string
          maxLength: 128
          description: 忘记密码邮件链接携带的一次性 token（30 分钟有效）
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 大写/小写/数字/符号四类中至少两类
        newPasswordConfirm:
          type: string
          format: password
          description: 确认密码，必填，须与 newPassword 一致
    UnsubscribeRequest:
      type: object
      description: 一键退订通知邮件请求（token 化链接，无需登录）
      required: [token]
      properties:
        token:
          type: string
          maxLength: 256
          description: 通知邮件退订链接携带的 token（HMAC 签名，180 天有效）
    UpdateNoticePrefRequest:
      type: object
      description: 设置通知邮件偏好（总开关）
      required: [emailNoticeEnabled]
      properties:
        emailNoticeEnabled:
          type: boolean
          description: 通知邮件总开关
    UpdateMeRequest:
      type: object
      description: 修改本人资料请求（字段可选；昵称去空白后 ≤50）
      properties:
        nickname:
          type: string
          maxLength: 50
        avatarUrl:
          type: string
          maxLength: 1024
    ChangeIdentifierRequest:
      type: object
      description: 换绑邮箱/手机号请求（手机号为可选附加绑定，不再清空另一标识，邮箱与手机号可并存、各自至多一个）
      required: [type, value, password, captchaId, captchaCode]
      properties:
        type:
          type: string
          enum: [email, phone]
        value:
          type: string
          description: 新邮箱或手机号
        emailCode:
          type: string
          maxLength: 16
          description: 邮件验证码，仅 type=email 必填（发往 value 新邮箱，purpose=rebind，见 POST /auth/email-code），一次性消费
        password:
          type: string
          format: password
          description: 当前密码
        captchaId:
          type: string
        captchaCode:
          type: string
    ChangeUsernameRequest:
      type: object
      description: 修改主页用户名请求（2-32 位字母/数字/-/_，自动 trim 并转小写）
      required: [username]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_-]{2,32}$'
    ProfilePageRequest:
      type: object
      description: 编辑个人主页请求（字段均可选，传 null 清空；省略表示不动）
      properties:
        bio:
          type: [string, 'null']
          maxLength: 100
        profileReadme:
          type: [string, 'null']
          maxLength: 10000
        pinnedItems:
          type: array
          maxItems: 6
          description: ≤6 项、不得重复、目标必须存在且属于本人；[] 清空
          items:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                enum: [ARTICLE, ISSUE, RESOURCE]
              id:
                type: string
                description: 目标 uuid
        company:
          type: [string, 'null']
          maxLength: 100
        location:
          type: [string, 'null']
          maxLength: 100
        link:
          type: [string, 'null']
          maxLength: 200
          description: 可裸域名
        socials:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 200
          description: ≤4 条、每条 ≤200（空串条目自动剔除）
        skillTags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
          description: 擅长标签 ≤10 个、每个 ≤30 字符（统一标签系统归一：小写、去重，空串条目剔除）；[] 清空
    CreateArticleRequest:
      type: object
      description: 创建文章请求（MEMBER 创建即 PENDING 待审；其余角色创建即 PUBLISHED）
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
          description: 可选；显式 null 返回 400
    UpdateArticleRequest:
      type: object
      description: 编辑文章请求（字段可选；tags [] 清空、null 返回 400）
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
    ReviewRequest:
      type: object
      description: '文章审核请求。状态机：approve PENDING→PUBLISHED；reject PENDING→REJECTED；hide PUBLISHED→HIDDEN；unhide HIDDEN→PUBLISHED（不满足 409）'
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, hide, unhide]
        note:
          type: string
          maxLength: 500
          description: 审核备注，可选
    CreateAssignmentRequest:
      type: object
      description: 发布作业请求（startAt / deadlineAt 必须是带 Z 的 ISO 8601 UTC 字符串，秒必填、毫秒最多 3 位）
      required: [title, description, startAt, deadlineAt]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        startAt:
          type: string
          format: date-time
          examples: ['2026-11-01T00:00:00.000Z']
        deadlineAt:
          type: string
          format: date-time
          examples: ['2026-11-30T23:59:59.000Z']
    UpdateAssignmentRequest:
      type: object
      description: 编辑作业请求（字段可选；时间格式要求同创建）
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        startAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
    CreateIssueRequest:
      type: object
      description: 创建 Issue 请求（VISITOR 403；创建默认 OPEN）
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
    CreateReplyRequest:
      type: object
      description: 回复 Issue 请求（所有角色含 VISITOR 可用）
      required: [content]
      properties:
        content:
          type: string
    IssueStatusRequest:
      type: object
      description: 变更 Issue 状态请求（仅 ADMIN/ALUMNI/WHEEL；流转到 ANSWERED 记录 answeredBy/answeredAt）
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IssueStatus'
    CreateAnnouncementRequest:
      type: object
      description: 发布公告请求（pinned / notify 可省略，必须是布尔值，null 或字符串 "false" 返回 400）
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        pinned:
          type: boolean
          description: 置顶，可选
        notify:
          type: boolean
          description: 发布同时向全员发站内通知，可选
    UpdateAnnouncementRequest:
      type: object
      description: 编辑公告请求（字段可选）
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        pinned:
          type: boolean
    CreateResourceRequest:
      type: object
      description: 创建资源请求（url 仅允许带协议的 HTTP/HTTPS 链接，FTP 等返回 400）
      required: [title, url, category]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          description: 可选
        url:
          type: string
          maxLength: 2048
        category:
          $ref: '#/components/schemas/ResourceCategory'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
    UpdateResourceRequest:
      type: object
      description: 编辑资源请求（字段可选；url 校验同创建）
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 2048
        category:
          $ref: '#/components/schemas/ResourceCategory'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
    AdminRoleRequest:
      type: object
      description: 修改用户角色请求（不能授予/变更为 ADMIN；目标是 ADMIN 账号 403）
      required: [role]
      properties:
        role:
          type: string
          enum: [VISITOR, MEMBER, ALUMNI, WHEEL]
    CreateInviteCodesRequest:
      type: object
      description: 生成邀请码请求（count 1~50 默认 1；maxUses 1~100 默认 1；expiresAt 可选 ISO 8601 UTC）
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        expiresAt:
          type: string
          format: date-time




