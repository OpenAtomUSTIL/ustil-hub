openapi: 3.1.0
info:
  title: USTIL 开放论坛 API
  version: 1.0.0
  summary: USTIL Hub 后端接口契约（docs/API.md 全量导出）
  description: |
    USTIL Hub（ustil-hub）后端 HTTP 契约的 OpenAPI 3.1 导出，作为 API 文档站（Scalar 渲染）的内容源。
    契约唯一事实来源为 `docs/API.md`（依据 `src/modules/**` 控制器与 service 层权限校验整理）；本文件只做结构化转写，不新增语义。

    ## 契约约定摘要

    - **路由前缀**：所有接口以 `/api/v1` 开头（已并入 servers URL，路径部分不再重复前缀）。
    - **认证方式**：httpOnly Cookie 双 token，前端无需手动携带 Header。
      - `access_token`：JWT（`sub` = userId，`role`），TTL 15 分钟，Path `/`；
      - `refresh_token`：JWT（`sub` + `jti`），刷新时轮换，TTL 7 天，Path `/api/v1/auth`。
    - **会话失效**：改密码 / 重置密码 / 登出 / 封禁 / 角色变更 → 清空该用户全部 refresh 并递增 `sessionVersion`，旧 access/refresh 同时失效（后续请求 401）。
    - **成功响应**：直接返回业务数据体（对象或数组），不包裹 `code/message/data`。
    - **失败响应**（全局 `AllExceptionsFilter` 统一产出）：`{ statusCode, error, message, path, timestamp }`；`message` 可为 `string` 或 `string[]`（校验错误）。
    - **错误码语义**：`400` 参数校验失败 / 文件不合规 / 当前密码错误 / 两次输入的密码不一致 / 密码复杂度不足 / 验证码错误或已失效 / 链接无效或已过期；`401` 未登录或登录已过期；`403` 已登录但无权限 / 被封禁 / 超出提交时间 / `VISITOR` 访问作业；`404` 资源不存在或不可见；`409` 状态冲突（标识被占用、邀请码无效/作废/过期/用尽）；`429` 登录失败次数过多 / 注册尝试过频 / 邮件验证码拉取过频 / 图形验证码获取过频，临时限制。
    - **分页**：请求 `?page=1&pageSize=20`（`pageSize` 默认 20、上限 100，超出直接 400 拒绝，不静默截断）；响应 `{ items, total, page, pageSize }`。
    - **时间**：一律 ISO 8601 UTC 字符串（`2026-11-09T03:04:10.212Z`）；不接受 Unix 时间戳、无时区时间或无效日历日期。
    - **校验**：全局 `ValidationPipe` 开启 `whitelist + forbidNonWhitelisted`，请求体中出现未声明字段直接 400。标题与昵称创建/更新时去除首尾空白后校验，纯空白返回 400；标题最长 200 字符、昵称最长 50 字符。
    - **角色（RBAC 五级）**：`VISITOR` 临时访客（非邀请码注册，7 天内未持码转正自动删号，禁止查阅/提交作业）/ `MEMBER` 学习成员（持码注册，发起讨论、提交作业）/ `ALUMNI` 校友（发文章、布置作业）/ `WHEEL` 负责人（邀请码、剔除、提拔、发布内容、变更 issue 状态、删除讨论/作业）/ `ADMIN` 管理员（任免 WHEEL、封禁、删他人内容；`ADMIN` 账号本身不可被改角色/删除/封禁）。
    - **权限标注**：description 中 `🔓公开` 无需登录；`🔐登录` 任意已登录角色；`🛡️角色` 需指定角色；`👤` 需资源归属（所有者）校验；`⏰` 受业务状态/时间窗口约束。
    - **slug 寻址（去 id 化）**：文章 / 作业 / 公告 / 资源 / Issue 创建时由标题生成唯一 slug（URL 不暴露裸 id）。详情类读接口 `:id` 可传 uuid 或 slug（uuid 优先匹配）；写接口（编辑 / 删除 / 审核 / 状态变更 / 回复 / 提交）仅接受 uuid，传 slug 返回 400。
    - **解析式寻址（用户）**：用户读接口 `:id` 可传 uuid 或 username；用户管理类路径参数（封禁 / 解封 / 改角色 / 提前提拔 / 剔除学员）支持 uuid / username / email / phone 四种标识（uuid → username（含历史 handle）→ email → phone 依次解析），解析不到返回 404「用户不存在」。查询过滤参数（`userId` / `actorId` / `authorId` / `creatorId` 等）同样支持四种标识，解析不到返回空列表（不报错）。
    - **图形验证码**：`captchaId` + `captchaCode` 为注册 / 登录 / 改密 / 换绑 / 持码转正 / 拉取邮件验证码 / 忘记密码的必填字段；一次性消费（校验通过即作废，复用直接失败），单 `captchaId` 校验失败 3 次作废；校验失败统一 400「验证码错误或已失效」（不区分过期 / 错误 / 已消费）；获取图片按客户端 IP 限每分钟 60 次（超限 429），与登录/注册失败限流叠加。
    - **事务邮件（v12.0）**：注册仅邮箱且须邮件验证码验证（purpose=register）；换绑邮箱须新邮箱验证码（purpose=rebind）；忘记密码走邮件一次性重置链接（30 分钟、一次性）；通知邮件受「邮件提醒」总开关 `emailNoticeEnabled` 约束（**默认开**），邮件内附一键退订链接（token 180 天有效）；回复类副本按在线状态抑制——收件人在线只留站内通知、不在线才发，公告等通用类不抑制。邮件验证码与链接 token 均一次性消费。
    - **软删除与 purge**：文章 / 公告 / 资源 / 讨论（issue）/ 作业 / 评论（讨论回复）的 DELETE 为软删（置 `deleted_at`）进回收站，可经 `POST /admin/trash/{type}/{id}/restore` 还原；软删期间列表/详情/搜索/tag 过滤/tag 计数均排除软删行（详情 404），`taggings` 与提交/回复保留（随所属讨论/作业一并隐藏、恢复一并回来），恢复后完整可见；重复恢复返回 409。剔除学员为硬删 purge（单事务）：连同名下文章/公告/资料/作业（含回收站软删行）一并硬删，级联其 issues/replies/提交，已有他人提交的作业改派给操作者（不连带删他人提交）。
    - **个人字段信封加密（v10.0）**：`email` / `phone` / `bio` / `company` / `location` / `link` / `socials` / `profileReadme` 库内为 AES-256-GCM 信封密文（配 `email_hmac` / `phone_hmac` 精确查找列）。**API 契约不变——请求/响应仍为明文**，加解密仅在服务端内部完成，本文件所有接口语义不受影响。后台用户 keyword 模糊搜只搜昵称/用户名（密文不可模糊检索）。
    - **文件上传**（头像、作业提交共用规则）：扩展名 + mime 双校验，白名单 `doc docx pdf png jpg jpeg zip`，单文件 ≤10MB（`UPLOAD_MAX_SIZE` 可配）；存储 key 为 UUID + 扩展名，文件 URL 一律经受控接口（bucket 不开放公共访问）。
    - **资源地址**：创建、更新只允许带协议的 HTTP / HTTPS 链接，FTP 等其他协议返回 400。
    - **标签**：`tags` 可省略，更新时 `[]` 表示清空，显式 `null` 返回 400。公告 `pinned` / `notify` 可省略，必须是布尔值，`null` 或字符串 `"false"` 返回 400。
servers:
  - url: https://forum.openatomustil.cn/api/v1
    description: 生产环境
  - url: http://localhost:3000/api/v1
    description: 本地调试（自签证书，见 deploy/init-certs.sh）
tags:
  - name: 认证
    description: 注册、登录、令牌刷新、密码、图形与邮件验证码、退订（/auth）
  - name: 用户
    description: 本人资料、个人主页、通知邮件偏好、关注关系与公开徽章（/users）
  - name: 文章
    description: 文章创作、审核状态机与可见性（/articles）
  - name: 作业
    description: 作业发布、时间窗口派生状态与提交（/assignments）
  - name: 讨论
    description: Issue 发起、回复与状态流转（/issues）
  - name: 公告
    description: 公告发布与管理（/announcements）
  - name: 资源
    description: 外链资源库（/resources）
  - name: 标签
    description: 统一标签体系，覆盖 ARTICLE / ISSUE / RESOURCE（/tags）
  - name: 通知
    description: 站内通知，仅操作本人通知（/notifications）
  - name: 存储
    description: 受控文件读取（/storage）
  - name: 后台管理
    description: 用户管理、邀请码、文件、回收站、评论、日志与统计（/admin）
security:
  - cookieAuth: []
paths:
  /auth/register:
    post:
      tags: [认证]
      summary: 注册
      operationId: authRegister
      description: |
        🔓 公开。仅邮箱注册（v12.0 起手机号改为可选附加绑定），注册前须先经 /auth/email-code 拉取邮件验证码（purpose=register）。

        - 邮箱验证：`emailCode` 发往 identifier 邮箱，一次性消费，校验通过即视为邮箱已验证。
        - 密码规则：8~128 位，且 大写/小写/数字/符号 四类中至少两类（错误文案「密码需包含大写字母、小写字母、数字、符号中的至少两类」）；`passwordConfirm` 与 `password` 不一致 → 400「两次输入的密码不一致」。
        - 有有效邀请码 → 注册为 `MEMBER` 并核销名额；无码 → `VISITOR`（7 天内可持码经 /auth/invite-code 转正，逾期自动删号）。
        - 成功写入 `access_token` / `refresh_token` 双 token Cookie。
        - 失败：400 参数非法 / 两次输入的密码不一致 / 密码复杂度不足 / 验证码错误或已失效（图形或邮件验证码）；409 邮箱已注册、邀请码无效/已作废/已过期/已被用尽；429 同 IP 15 分钟内注册尝试超过 10 次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              identifier: user@example.com
              emailCode: '482913'
              password: Str0ngPass!23
              passwordConfirm: Str0ngPass!23
              nickname: 小明
              inviteCode: USTIL-7F3K9Q
              captchaId: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
              captchaCode: 7k2p
      responses:
        '201':
          description: 注册成功，返回本人资料并写入双 token Cookie
          headers:
            Set-Cookie:
              description: 写入 access_token（Path=/）与 refresh_token（Path=/api/v1/auth），httpOnly
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
              example:
                id: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
                username: xiaoming
                nickname: 小明
                avatarUrl: null
                role: MEMBER
                status: ACTIVE
                email: user@example.com
                createdAt: '2026-11-09T03:04:10.212Z'
                updatedAt: '2026-11-09T03:04:10.212Z'
        '400':
          description: '参数校验失败 / 两次输入的密码不一致「两次输入的密码不一致」/ 密码复杂度不足「密码需包含大写字母、小写字母、数字、符号中的至少两类」/ 图形或邮件验证码错误或已失效「验证码错误或已失效」'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                校验失败:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message:
                      - passwordConfirm must match password exactly
                    path: /api/v1/auth/register
                    timestamp: '2026-11-09T03:04:10.212Z'
                业务拒绝:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: 两次输入的密码不一致
                    path: /api/v1/auth/register
                    timestamp: '2026-11-09T03:04:10.212Z'
        '409':
          description: '邮箱已注册；或邀请码无效/已作废/已过期/已被用尽'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                error: Conflict
                message: 该邮箱已被注册
                path: /api/v1/auth/register
                timestamp: '2026-11-09T03:04:10.212Z'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/invite-code:
    post:
      tags: [认证]
      summary: 持码转正
      operationId: authInviteCode
      description: |
        🔐 登录（仅 `VISITOR`，其他角色 403）。VISITOR 持有效邀请码转为 `MEMBER` 并核销名额。

        - 成功换发新双 token Cookie（旧 refresh 全部作废）。
        - 失败：400 验证码错误或已失效；403 非 VISITOR；409 邀请码无效/作废/过期/用尽。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCodeRequest'
            example:
              inviteCode: USTIL-7F3K9Q
              captchaId: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
              captchaCode: 7k2p
      responses:
        '201':
          description: 转正成功，返回 UserSelf（角色变为 MEMBER），换发新双 token Cookie
          headers:
            Set-Cookie:
              description: 换发 access_token 与 refresh_token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: '非 VISITOR 账号不可持码转正'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 无权访问该资源
                path: /api/v1/auth/invite-code
                timestamp: '2026-11-09T03:04:10.212Z'
        '409':
          description: '邀请码无效/已作废/已过期/已被用尽'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                error: Conflict
                message: 邀请码无效
                path: /api/v1/auth/invite-code
                timestamp: '2026-11-09T03:04:10.212Z'
  /auth/login:
    post:
      tags: [认证]
      summary: 登录
      operationId: authLogin
      description: |
        🔓 公开。邮箱或手机号 + 密码登录。

        - 401 统一提示「账号或密码错误」（不区分用户不存在/密码错误，防账号枚举）。
        - 429 同一账号 + IP 15 分钟内失败 5 次，锁定 15 分钟。
        - 403 账号被封禁。400 验证码错误或已失效。
        - 成功与失败均写入 `login_logs`（成功含 userId；失败 userId 为空，failReason 区分 `用户不存在` / `密码错误` / `账号已封禁` / `登录尝试过于频繁`），不落密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: user@example.com
              password: Str0ngPass!23
              captchaId: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
              captchaCode: 7k2p
      responses:
        '201':
          description: 登录成功，返回本人资料并写入双 token Cookie
          headers:
            Set-Cookie:
              description: 写入 access_token 与 refresh_token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
              example:
                id: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
                username: xiaoming
                nickname: 小明
                avatarUrl: null
                role: MEMBER
                status: ACTIVE
                email: user@example.com
                createdAt: '2026-11-09T03:04:10.212Z'
                updatedAt: '2026-11-09T03:04:10.212Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '统一提示「账号或密码错误」（不区分用户不存在/密码错误）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                error: Unauthorized
                message: 账号或密码错误
                path: /api/v1/auth/login
                timestamp: '2026-11-09T03:04:10.212Z'
        '403':
          description: '账号被封禁（status = BANNED）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 账号已被封禁
                path: /api/v1/auth/login
                timestamp: '2026-11-09T03:04:10.212Z'
        '429':
          description: '同一账号 + IP 15 分钟内失败 5 次，锁定 15 分钟'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 429
                error: Too Many Requests
                message: 登录尝试过于频繁
                path: /api/v1/auth/login
                timestamp: '2026-11-09T03:04:10.212Z'
  /auth/refresh:
    post:
      tags: [认证]
      summary: 刷新令牌
      operationId: authRefresh
      description: |
        🔓 公开（依赖 `refresh_token` Cookie）。轮换 token：旧 `jti` 立即作废并签发新对。

        - 旧 `jti` 复用视为窃取，清除该用户全部 refresh 并强制重登。
        - 成功返回 **UserPublic**（脱敏，仅 id/username/nickname/avatarUrl/role，不含 email/phone）；前端登录态恢复一律以 `GET /auth/me` 为 UserSelf 来源。
        - 失败：401 refresh 缺失/无效/已作废。
      security:
        - refreshCookieAuth: []
      responses:
        '201':
          description: 刷新成功，返回 UserPublic 并写入新双 token Cookie
          headers:
            Set-Cookie:
              description: 换发 access_token 与 refresh_token（轮换 jti）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: 'refresh_token 缺失/无效/已作废'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                error: Unauthorized
                message: 未登录或登录已过期
                path: /api/v1/auth/refresh
                timestamp: '2026-11-09T03:04:10.212Z'
  /auth/logout:
    post:
      tags: [认证]
      summary: 登出
      operationId: authLogout
      description: |
        🔓 公开。清除双 token Cookie 并作废 refresh；同时写入登录日志（success: true，含 userId）。
        会清空该用户全部 refresh 并递增 sessionVersion。
      responses:
        '204':
          description: 已登出，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password:
    post:
      tags: [认证]
      summary: 修改密码
      operationId: authChangePassword
      description: |
        🔐 登录。修改本人密码。

        - 新密码同注册复杂度规则（8~128 位、至少两类字符）。
        - 需当前绑定邮箱的邮件验证码（emailCode，purpose=password，先经 /auth/email-code 拉取）；未绑定邮箱 400「该账号未绑定邮箱，请先绑定邮箱后再修改密码」。
        - 成功后清除该用户全部 refresh 并递增 sessionVersion（其它端需重新登录）。
        - 失败：400 当前密码错误 / 新密码复杂度不足 / 图形或邮件验证码错误或已失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
