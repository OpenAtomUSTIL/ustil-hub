        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [后台管理]
      summary: 生成邀请码
      operationId: adminCreateInviteCodes
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。批量生成邀请码。

        - `count` 生成个数 1~50，默认 1；`maxUses` 单码可用人数 1~100，默认 1；`expiresAt` 可选 ISO 8601 UTC 字符串。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteCodesRequest'
