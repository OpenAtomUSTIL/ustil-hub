                message: 无权访问该资源
                path: /api/v1/admin/users/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e/promote
                timestamp: '2026-11-09T03:04:10.212Z'
        '404':
          description: '用户不存在（解析式寻址未命中）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}:
    delete:
      tags: [后台管理]
      summary: 剔除学员
      operationId: adminDeleteUser
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。

        - 寻址：`id` 支持 uuid / username / email / phone（uuid 优先），解析不到 404「用户不存在」。
        - **硬删 purge（单事务）**：删除账号，连同其名下文章/公告/资料/作业（含回收站软删行）一并硬删，级联删除其 issues/replies/提交（先清 taggings 再删内容）；名下作业已有他人提交的改派给操作者（不连带删他人提交）。
        - **仅 `MEMBER` / `VISITOR` 可被剔除**，`ALUMNI` 及以上不可（403）；`ADMIN` 账号不可被删除（403）。
        - 附件及受控头像的文件 key 与删号同事务写入 `file_deletions`，数据库提交后异步删除存储对象（删除幂等、失败重试）。
      parameters:
        - $ref: '#/components/parameters/AdminUserRefParam'
      responses:
        '204':
          description: 已剔除，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '目标角色不可剔除（ALUMNI 及以上 / ADMIN 账号）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 无权访问该资源
                path: /api/v1/admin/users/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
                timestamp: '2026-11-09T03:04:10.212Z'
        '404':
          description: '用户不存在（解析式寻址未命中）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
