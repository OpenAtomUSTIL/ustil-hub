                    error: Bad Request
                    message: 链接无效或已过期
                    path: /api/v1/auth/password/reset
                    timestamp: '2026-11-09T03:04:10.212Z'
                密码不一致:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: 两次输入的密码不一致
                    path: /api/v1/auth/password/reset
                    timestamp: '2026-11-09T03:04:10.212Z'
