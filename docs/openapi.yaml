                readingMinutes: 4
                author:
                  id: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1f
                  username: xiaoming
                  nickname: 小明
                  avatarUrl: null
                  role: MEMBER
                createdAt: '2026-11-09T03:04:10.212Z'
                updatedAt: '2026-11-09T03:04:10.212Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '文章不存在 / 不可见（非 PUBLISHED 且非作者或管理员）/ 已软删'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                error: Not Found
                message: 资源不存在或不可见
                path: /api/v1/articles/hello-ustil
                timestamp: '2026-11-09T03:04:10.212Z'
    patch:
      tags: [文章]
      summary: 编辑文章
      operationId: articlesUpdate
      description: |
        🛡️ 角色：`MEMBER`/`ALUMNI`/`WHEEL`/`ADMIN` + 👤 仅作者本人（**`ADMIN` 也不能编辑他人文章**）。
        **仅 uuid 寻址**，传 slug 返回 400。

        - `MEMBER` 只能修改本人 `PENDING` / `REJECTED` 文章（已发布文章 403「已发布的文章需联系管理员修改」）；修改被拒文章的标题、正文或标签后重新进入 `PENDING`，并清空上次审核结果。
        - 字段可选：title / content / tags。`tags` 传 `[]` 清空、显式 `null` 400。
      parameters:
        - $ref: '#/components/parameters/ContentIdUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
            example:
              title: USTIL 学习路线（修订）
      responses:
        '200':
          description: 更新后的文章详情
          content:
