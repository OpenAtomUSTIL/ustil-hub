        | `hide` | `PUBLISHED` | `HIDDEN` |
        | `unhide` | `HIDDEN` | `PUBLISHED` |

        记录 `reviewedBy` / `reviewedAt` / `reviewNote`；拒绝/隐藏备注经 ArticleDetail.reviewNote 对作者可见。
