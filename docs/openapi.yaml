  /admin/files/{id}/content:
    get:
      tags: [后台管理]
      summary: 文件内容预览
      operationId: adminFileContent
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。返回文件字节流（`Content-Type` 按扩展名，`Content-Disposition: inline`，`Cache-Control: private, no-store`）。

        - `id`：`ATTACHMENT` 传附件 uuid；`AVATAR` 传 `avatar:<userId>`。
        - 头像可供管理人员预览；作业附件中 ADMIN 可读取，WHEEL 仅可读取其本人发布作业的附件；未关联提交的附件仅 ADMIN 可读取。
        - 失败：400 id 非法；404 文件不存在。
      parameters:
        - $ref: '#/components/parameters/FileIdParam'
      responses:
        '200':
          description: '文件字节流（Content-Disposition: inline）'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 'id 非法'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                error: Bad Request
                message: 文件 id 非法
                path: /api/v1/admin/files/bad-id/content
                timestamp: '2026-11-09T03:04:10.212Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'WHEEL 读取非本人发布作业的附件 / 未关联提交的附件'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '文件不存在'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/files/{id}:
    delete:
      tags: [后台管理]
      summary: 删除文件
      operationId: adminDeleteFile
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。写入审计 `file.delete`。

        - `AVATAR` 条目（id 形如 `avatar:<userId>`）删除即清空对应用户头像引用；`ATTACHMENT` 删除物理文件与记录。
        - 失败：400 id 非法；404 文件不存在；409 文件使用中，不可删除（被作业提交或用户头像引用）。
      parameters:
        - $ref: '#/components/parameters/FileIdParam'
      responses:
        '204':
          description: 已删除，无响应体
        '400':
          description: 'id 非法'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '文件不存在'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '文件使用中，不可删除（被作业提交或用户头像引用）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                error: Conflict
                message: 文件使用中，不可删除
                path: /api/v1/admin/files/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
                timestamp: '2026-11-09T03:04:10.212Z'
