              count: 3
              maxUses: 2
              expiresAt: '2026-12-31T23:59:59.000Z'
      responses:
        '201':
          description: 生成成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InviteCodeView'
        '400':
          description: 'count / maxUses 超出范围 / expiresAt 非法'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/invite-codes/{id}/revoke:
