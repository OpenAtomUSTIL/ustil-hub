      responses:
        '200':
          description: 请求日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/api-registry:
    get:
      tags: [后台管理]
      summary: 接口清单
      operationId: adminApiRegistry
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。运行时枚举全站路由 + `@Public()` / `@Roles()` 元数据（含全局守卫「默认需登录」语义：`isPublic: false` 且 `roles: []` 表示任意已登录角色可访问）。

        - 反射为控制器层元数据；Multer 等中间件层约束（上传字段名、大小限制）无法从路由元数据读取，需参见对应接口文档。
        - 返回数组，按 `path` 升序排序。
      responses:
        '200':
          description: 接口清单数组（按 path 升序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiRegistryItem'
              example:
                - method: GET
                  path: /api/v1/articles
                  isPublic: false
                  roles: []
                  controller: ArticlesController
                  handler: list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        httpOnly Cookie 双 token 之 `access_token`（JWT，含 `sub` = userId 与 `role`，TTL 15 分钟，Path `/`）。
        前端无需手动携带 Header；改密/登出/封禁/角色变更后旧 token 失效（401）。
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        httpOnly Cookie `refresh_token`（JWT，含 `sub` + `jti`，TTL 7 天，Path `/api/v1/auth`），仅刷新/登出接口可见。
        刷新时轮换：旧 `jti` 立即作废；旧 `jti` 复用视为窃取，清除该用户全部 refresh 并强制重登。
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 页码，正整数，默认 1；非法值返回 400
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页条数，1~100，默认 20；超出 100 直接 400 拒绝（不静默截断）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    KeywordParam:
      name: keyword
      in: query
      required: false
      description: 关键词模糊搜索，≤100 字符
      schema:
        type: string
        maxLength: 100
    TagFilterParam:
      name: tag
      in: query
      required: false
      description: 按标签名过滤，≤30 字符
      schema:
        type: string
        maxLength: 30
    AuthorIdParam:
      name: authorId
      in: query
      required: false
      description: 按作者过滤；支持 uuid / 用户名 / 邮箱 / 手机号（解析式寻址），解析不到返回空列表（不报错）
      schema:
        type: string
    CreatorIdParam:
      name: creatorId
      in: query
      required: false
      description: 按创建者过滤；支持 uuid / 用户名 / 邮箱 / 手机号（解析式寻址），解析不到返回空列表（不报错）
      schema:
        type: string
    ActorIdParam:
      name: actorId
      in: query
      required: false
      description: 按操作者过滤；支持 uuid / 用户名 / 邮箱 / 手机号（解析式寻址），解析不到返回空列表（不报错）
      schema:
        type: string
    UserIdParam:
      name: userId
      in: query
      required: false
      description: 按用户过滤；支持 uuid / 用户名 / 邮箱 / 手机号（解析式寻址），解析不到返回空列表（不报错）
      schema:
        type: string
    ContentIdParam:
      name: id
      in: path
      required: true
      description: '内容 id：可传 uuid 或 slug（uuid 优先匹配）。详情类读接口支持 slug 寻址。'
      schema:
        type: string
    ContentIdUuidParam:
      name: id
      in: path
      required: true
      description: '内容 id：仅接受 uuid（写接口：编辑/删除/审核/状态变更/回复/提交）；传 slug 返回 400。'
      schema:
        type: string
    UserRefParam:
      name: id
      in: path
      required: true
      description: '用户 id：可传 uuid 或 username（uuid 优先匹配，含历史 handle）。'
      schema:
        type: string
    AdminUserRefParam:
      name: id
      in: path
      required: true
      description: '用户标识（解析式寻址）：支持 uuid / username / email / phone（uuid → username（含历史 handle）→ email → phone 依次解析），解析不到返回 404「用户不存在」。'
      schema:
        type: string
    UsernameParam:
      name: username
      in: path
      required: true
      description: 仅 username 寻址（主页 handle，2-32 位字母/数字/-/_，小写）
      schema:
        type: string
    FileIdParam:
      name: id
      in: path
      required: true
      description: "文件 id：ATTACHMENT 传附件 uuid；AVATAR 传 'avatar:<userId>' 形式"
      schema:
        type: string
  responses:
    BadRequest:
      description: '400 参数校验失败 / 文件不合规 / 当前密码错误 / 两次输入的密码不一致 / 密码复杂度不足 / 验证码错误或已失效等'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            校验失败:
              summary: 校验失败（message 为数组）
              value:
                statusCode: 400
                error: Bad Request
                message:
                  - title must be shorter than or equal to 200 characters
                  - tags must contain no more than 10 elements
                path: /api/v1/articles
                timestamp: '2026-11-09T03:04:10.212Z'
            业务拒绝:
              summary: 业务规则拒绝（message 为字符串）
              value:
                statusCode: 400
                error: Bad Request
                message: 两次输入的密码不一致
                path: /api/v1/auth/register
                timestamp: '2026-11-09T03:04:10.212Z'
            验证码失效:
              summary: 验证码错误或已失效（一次性消费 / 失败 3 次作废）
              value:
                statusCode: 400
                error: Bad Request
                message: 验证码错误或已失效
                path: /api/v1/auth/login
                timestamp: '2026-11-09T03:04:10.212Z'
    Unauthorized:
      description: '401 未登录或登录已过期'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            未登录:
              value:
                statusCode: 401
                error: Unauthorized
                message: 未登录或登录已过期
                path: /api/v1/articles
                timestamp: '2026-11-09T03:04:10.212Z'
            账号或密码错误:
              summary: 登录接口统一提示（不区分用户不存在/密码错误）
              value:
                statusCode: 401
                error: Unauthorized
                message: 账号或密码错误
                path: /api/v1/auth/login
                timestamp: '2026-11-09T03:04:10.212Z'
    Forbidden:
      description: '403 已登录但无权限 / 被封禁 / 超出提交时间 / VISITOR 访问作业'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            无权访问:
              value:
                statusCode: 403
                error: Forbidden
                message: 无权访问该资源
                path: /api/v1/articles/1
                timestamp: '2026-11-09T03:04:10.212Z'
    NotFound:
      description: '404 资源不存在或不可见'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            资源不可见:
              value:
                statusCode: 404
                error: Not Found
                message: 资源不存在或不可见
                path: /api/v1/articles/hello-ustil
                timestamp: '2026-11-09T03:04:10.212Z'
            用户不存在:
              summary: 解析式寻址未命中（封禁/解封/改角色/提拔/剔除等）
              value:
                statusCode: 404
                error: Not Found
                message: 用户不存在
                path: /api/v1/admin/users/nobody/role
                timestamp: '2026-11-09T03:04:10.212Z'
    Conflict:
      description: '409 状态冲突（标识被占用、邀请码无效/作废/过期/用尽、状态机不符、重复恢复等）'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            标识被占用:
              value:
                statusCode: 409
                error: Conflict
                message: 该邮箱已被注册
                path: /api/v1/auth/register
                timestamp: '2026-11-09T03:04:10.212Z'
            状态冲突:
              summary: 回收站重复恢复
              value:
                statusCode: 409
                error: Conflict
                message: 内容未被删除，无需恢复
                path: /api/v1/admin/trash/ARTICLE/018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e/restore
                timestamp: '2026-11-09T03:04:10.212Z'
    RateLimited:
      description: '429 触发限流：登录失败次数过多（同账号 + IP 15 分钟内失败 5 次，锁定 15 分钟）/ 注册尝试过频（同 IP 15 分钟 10 次）/ 邮件验证码拉取过频（同邮箱 1 分钟 1 封、1 小时 5 封）/ 图形验证码获取超频（同 IP 每分钟 60 次）'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 429
            error: Too Many Requests
            message: 登录尝试过于频繁
            path: /api/v1/auth/login
            timestamp: '2026-11-09T03:04:10.212Z'
    NoContent:
      description: 操作成功，无响应体
  schemas:
    Error:
      type: object
      description: 全局失败响应体（AllExceptionsFilter 统一产出），字段一个不多一个不少
      required: [statusCode, error, message, path, timestamp]
      properties:
        statusCode:
          type: integer
          examples: [403]
        error:
          type: string
          examples: [Forbidden]
        message:
          description: 错误文案；校验失败时为字符串数组，业务失败时为单条字符串
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        path:
          type: string
          description: 请求路径（含 /api/v1 前缀）
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC 字符串
    PageMeta:
      type: object
      description: 分页信封公共字段（items 由各分页 schema 补充）
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          description: 总条数
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
    Role:
      type: string
      description: |
        RBAC 五级角色：`VISITOR` 临时访客（禁查/交作业，7 天未持码转正自动删号）/ `MEMBER` 学习成员 / `ALUMNI` 校友 / `WHEEL` 负责人 / `ADMIN` 管理员（不可被改角色/删除/封禁）
      enum: [VISITOR, MEMBER, ALUMNI, WHEEL, ADMIN]
    UserStatus:
      type: string
      description: 账号状态；`BANNED` 在 JwtAuthGuard 直接 403
      enum: [ACTIVE, BANNED]
    UserPublic:
      type: object
      description: 用户公开资料（author / creator / submitter 等字段）
      required: [id, username, nickname, avatarUrl, role]
      properties:
        id:
          type: string
          description: uuid v7
        username:
          type: string
          description: 主页 handle（2-32 位字母/数字/-/_，全站唯一，小写）
        nickname:
          type: string
          maxLength: 50
        avatarUrl:
          type: [string, 'null']
          maxLength: 1024
        role:
          $ref: '#/components/schemas/Role'
    UserSelf:
      type: object
      description: |
        本人资料（仅本人接口返回，含私有字段）。email / phone 绑定才返回；v10.0 起库内信封加密、接口仍明文。
      required: [id, username, nickname, avatarUrl, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        email:
          type: string
          description: 绑定才返回（v10.0 库内密文、接口明文）
        phone:
          type: string
          description: 绑定才返回（v10.0 库内密文、接口明文）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AttachmentView:
      type: object
      description: 附件视图
      required: [id, key, originalName, size, mime, url]
      properties:
        id:
          type: string
        key:
          type: string
          description: 存储 key（UUID + 扩展名）
        originalName:
          type: string
        size:
          type: integer
          description: 字节数
        mime:
          type: string
        url:
          type: string
          description: 指向 /api/v1/storage/files/:key（受控接口，bucket 不开放公共访问）
    TagView:
      type: object
      description: 统一标签（覆盖 ARTICLE / ISSUE / RESOURCE）
      required: [id, name, count]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 30
        count:
          type: integer
          description: 引用计数（软删行不计）
    CaptchaResponse:
      type: object
      description: 图形验证码（自绘 PNG；答案 sha256 存 Redis、TTL 5 分钟、一次性消费）
      required: [captchaId, image]
      properties:
        captchaId:
          type: string
          description: 验证码 id（uuid），与 captchaCode 成对提交
        image:
          type: string
          description: data URI（可直接作 <img src>），图片不含文字答案元数据
    NoticePref:
      type: object
      description: 通知邮件偏好（v12.0 总开关，默认 true；回复类副本仅在收件人不在线时发送）
      required: [emailNoticeEnabled]
      properties:
        emailNoticeEnabled:
          type: boolean
          description: 通知邮件总开关；关闭后通知仅走站内
    ProfileStats:
      type: object
      description: 个人主页聚合计数（软删不计）
      required: [articles, issues, replies, submissions]
      properties:
        articles:
          type: integer
        issues:
          type: integer
        replies:
          type: integer
        submissions:
          type: integer
    PinnedItem:
      type: object
      description: 个人主页置顶项（仅保留仍存在且未软删的目标）
      required: [type, id, slug, title]
      properties:
        type:
          type: string
          enum: [ARTICLE, ISSUE, RESOURCE]
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        url:
          type: string
          description: 可选直达链接
    UserProfileView:
      type: object
      description: |
        个人主页视图。company / location / link / socials 为 v9.0 公开资料字段（对齐 GitHub 语义，公开可见）；
        email / phone 仅 isSelf 时返回（v10.0 库内信封密文、接口明文）。
      required: [id, username, nickname, avatarUrl, role, bio, profileReadme, company, location, link, socials, createdAt, stats, skillTags, pinnedItems, isSelf, isFollowing, followerCount, followingCount]
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        bio:
          type: [string, 'null']
          maxLength: 100
          description: 短简介（v10.0 库内密文、接口明文）
        profileReadme:
          type: [string, 'null']
          maxLength: 10000
          description: 个人介绍长文（v10.0 库内密文、接口明文）
        company:
          type: [string, 'null']
          maxLength: 100
          description: 公司/学校（v9.0 公开资料字段）
        location:
          type: [string, 'null']
          maxLength: 100
        link:
          type: [string, 'null']
          maxLength: 200
          description: 个人链接（可裸域名，展示层补 https://）
        socials:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 200
          description: 社交账户链接（≤4 条，空串条目剔除）
        createdAt:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/ProfileStats'
        skillTags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
          description: 擅长标签（本人自配置，统一标签系统小写归一；空数组 = 未配置）
        pinnedItems:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/PinnedItem'
        isSelf:
          type: boolean
        isFollowing:
          type: boolean
        followerCount:
          type: integer
        followingCount:
          type: integer
        email:
          type: string
          description: 仅 isSelf 时返回（v10.0 库内密文、接口明文）
        phone:
          type: string
          description: 仅 isSelf 时返回（v10.0 库内密文、接口明文）
    ProfileReplyView:
      type: object
      description: 个人主页回复列表条目
      required: [id, issueId, issueSlug, issueTitle, content, createdAt]
      properties:
        id:
          type: string
        issueId:
          type: string
        issueSlug:
          type: string
        issueTitle:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    FollowUserView:
      type: object
      description: 粉丝/关注列表条目（排除封禁用户）
      required: [id, username, nickname, avatarUrl, role, bio, isSelf, isFollowing]
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        bio:
          type: [string, 'null']
        isSelf:
          type: boolean
        isFollowing:
          type: boolean
          description: 当前访问者是否已关注该用户
    StatsBadgeItem:
      type: object
      description: shields.io endpoint 协议徽章（六枚：文章/讨论/回复/提交/近一年贡献/站内连击）
      required: [schemaVersion, label, message, color]
      properties:
        schemaVersion:
          type: integer
          const: 1
        label:
          type: string
        message:
          type: string
        color:
          type: string
    ActivityView:
      type: object
      description: 活跃热力图（近一年 UTC 日，五类事件按日求和、按日期升序）
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date:
                type: string
                description: YYYY-MM-DD
                examples: ['2026-11-09']
              count:
                type: integer
    ArticleStatus:
      type: string
      description: |
        文章状态：`PENDING` 待审（MEMBER 先审后发）/ `PUBLISHED` 已发布 / `REJECTED` 已拒绝 / `HIDDEN` 已隐藏。
        非 PUBLISHED 仅作者与 WHEEL/ADMIN 可见（他人 404）。
      enum: [PENDING, PUBLISHED, REJECTED, HIDDEN]
    ArticleListItem:
      type: object
      description: 文章列表条目；readingMinutes 只读不存库，编辑正文后自动重算
      required: [id, slug, title, excerpt, tags, status, readingMinutes, author, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
          description: 由标题生成的唯一 slug
        title:
          type: string
          maxLength: 200
        excerpt:
          type: string
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
        status:
          $ref: '#/components/schemas/ArticleStatus'
        readingMinutes:
          type: integer
          minimum: 1
          description: 阅读时长（分钟）：中文 300 字/分钟、其他 200 词/分钟，混合累计向上取整，至少 1
        author:
          $ref: '#/components/schemas/UserPublic'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArticleDetail:
      type: object
      description: 文章详情；reviewNote 拒绝/隐藏备注对作者可见（审核记录另有 reviewedBy / reviewedAt 服务端留档）
      required: [id, slug, title, content, tags, status, reviewNote, readingMinutes, author, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ArticleStatus'
        reviewNote:
          type: [string, 'null']
          maxLength: 500
        readingMinutes:
          type: integer
          minimum: 1
        author:
          $ref: '#/components/schemas/UserPublic'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssignmentState:
      type: string
      description: |
        作业状态由时间派生（服务端判定）：`NOT_STARTED` now < startAt（不可提交）/ `OPEN` startAt ≤ now ≤ deadlineAt / `CLOSED` now > deadlineAt（提交 403）。
      enum: [NOT_STARTED, OPEN, CLOSED]
    SubmissionView:
      type: object
      description: 作业提交视图
      required: [id, assignmentId, submitter, note, attachment, createdAt, updatedAt]
      properties:
        id:
          type: string
        assignmentId:
          type: string
        submitter:
          $ref: '#/components/schemas/UserPublic'
        note:
          type: [string, 'null']
          maxLength: 1000
        attachment:
          $ref: '#/components/schemas/AttachmentView'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssignmentItem:
      type: object
      description: 作业条目；canSubmit 仅 MEMBER/ALUMNI 且 state === OPEN 时为 true
      required: [id, slug, title, description, startAt, deadlineAt, state, canSubmit, publisher, mySubmission, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
          maxLength: 200
        description:
          type: string
        startAt:
          type: string
          format: date-time
          description: ISO 8601 UTC（带 Z，秒必填、毫秒可选最多 3 位）
        deadlineAt:
          type: string
          format: date-time
          description: ISO 8601 UTC（带 Z）
        state:
          $ref: '#/components/schemas/AssignmentState'
        canSubmit:
          type: boolean
        publisher:
          $ref: '#/components/schemas/UserPublic'
        mySubmission:
          oneOf:
            - $ref: '#/components/schemas/SubmissionView'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MySubmissionItem:
      type: object
      description: 我的提交记录条目
      required: [id, assignmentId, assignmentSlug, assignmentTitle, startAt, deadlineAt, state, note, attachment, createdAt, updatedAt]
      properties:
        id:
          type: string
        assignmentId:
          type: string
        assignmentSlug:
          type: string
        assignmentTitle:
          type: string
        startAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/AssignmentState'
        note:
          type: [string, 'null']
        attachment:
          description: 附件摘要（无附件为 null）
          oneOf:
            - type: object
              required: [id, fileName]
              properties:
                id:
                  type: string
                fileName:
                  type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueStatus:
      type: string
