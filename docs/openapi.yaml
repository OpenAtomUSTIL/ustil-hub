        🛡️ 角色：`WHEEL`、`ADMIN`。分页返回文件列表（`createdAt` desc）。

        - `ATTACHMENT` 来自 `attachments` 表（作业提交上传）；`AVATAR` 由 `users.avatar_url` 指向的存储文件合成（id 形如 `avatar:<userId>`，`createdAt` 取用户资料最后更新时间近似值）。
        - `keyword` ≤100，按文件名模糊匹配。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/KeywordParam'
