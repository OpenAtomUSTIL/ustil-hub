  /auth/captcha:
    get:
      tags: [认证]
      summary: 获取图形验证码
      operationId: authCaptcha
      description: |
        🔓 公开。自绘 PNG（无第三方服务；图片中不含文字答案元数据）。答案以 sha256 哈希存 Redis（不落明文），TTL 5 分钟。

        - 消费规则：`captchaId` + `captchaCode` 为注册 / 登录 / 改密 / 换绑 / 持码转正的必填字段。
        - **一次性消费**：校验通过即作废，同一 `captchaId` 复用直接校验失败；单 `captchaId` 校验失败 3 次作废。
        - 校验失败统一 400，message 恒为「验证码错误或已失效」（不区分过期 / 错误 / 已消费）。
        - 响应设置 `Cache-Control: no-store`；获取图片按客户端 IP 限制每分钟 60 次，超限 429，与登录/注册失败限流叠加。
      parameters:
        - name: theme
          in: query
          required: false
          description: 可选，`dark` = 深色调色板（深底亮字，供深色模式），默认浅色；仅影响图片配色，响应结构与校验规则不变
          schema:
            type: string
            enum: [dark, light]
            default: light
      responses:
        '200':
          description: '验证码图片与 id；Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'
              example:
                captchaId: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
                image: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        '429':
          description: '同一 IP 每分钟获取超过 60 次'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 429
                error: Too Many Requests
                message: 请求过于频繁
                path: /api/v1/auth/captcha
                timestamp: '2026-11-09T03:04:10.212Z'
  /auth/email-code:
    post:
      tags: [认证]
      summary: 拉取邮件验证码
      operationId: authSendEmailCode
      description: |
        🔓 公开。注册 / 换绑邮箱统一入口（v12.0）：向指定邮箱发送 6 位数字验证码，图形验证码前置防轰炸。

        - purpose=register：发往待注册邮箱（配合 /auth/register）；purpose=rebind：发往新邮箱（配合 /users/me/identifier 换绑）。
        - 验证码 10 分钟有效，只发邮件、**不返回响应体**（204）；一次性消费，输错 3 次作废（与图形验证码同口径，统一 400「验证码错误或已失效」）。
        - 失败：400 图形验证码错误或已失效 / 邮箱格式非法 / purpose 非法；429 同一邮箱 1 分钟 1 封 / 1 小时 5 封（「邮件发送过于频繁，请稍后再试」）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailCodeRequest'
            example:
              email: user@example.com
              purpose: register
              captchaId: 018f0d5e-6c1f-7c2a-9b3e-2f4d6a8b0c1e
              captchaCode: 7k2p
      responses:
        '204':
          description: 验证码邮件已入队，无响应体；最终投递异步完成
        '400':
          description: '图形验证码错误或已失效「验证码错误或已失效」/ 邮箱格式非法 / purpose 非法'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                error: Bad Request
                message: 验证码错误或已失效
                path: /api/v1/auth/email-code
                timestamp: '2026-11-09T03:04:10.212Z'
        '429':
          description: '同一邮箱 1 分钟 1 封 / 1 小时 5 封，超限「邮件发送过于频繁，请稍后再试」'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 429
                error: Too Many Requests
                message: 邮件发送过于频繁，请稍后再试
                path: /api/v1/auth/email-code
                timestamp: '2026-11-09T03:04:10.212Z'
        '503':
          description: 邮件未启用或入队失败，验证码邮件暂时无法发送，请稍后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
