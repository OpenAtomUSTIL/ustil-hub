      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          required: false
          description: 按邀请码状态过滤
          schema:
            type: string
            enum: [ACTIVE, REVOKED]
      responses:
        '200':
          description: 邀请码分页
