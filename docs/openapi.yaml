      tags: [后台管理]
      summary: 请求日志
      operationId: adminRequestLogs
      description: |
        🛡️ 角色：`WHEEL`、`ADMIN`。记录范围为**全部 `/api/v1/**` 请求（含 GET）**，响应完成后异步写库、失败静默。
        `userId` 支持 uuid / 用户名 / 邮箱 / 手机号（解析不到返回空列表，不报错）。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
